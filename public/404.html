<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8fafc">
  <meta name="description" content="404 - The page you are looking for could not be found.">
  <title>404 — Page Not Found</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f8fafc;
      --surface: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --primary: #635bff;
      --primary-dark: #5048e5;
      --border: #e8edf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(99, 91, 255, .10), transparent 30%),
        radial-gradient(circle at 85% 85%, rgba(56, 189, 248, .10), transparent 28%),
        var(--background);
    }
    .container {
      width: min(100%, 720px);
      padding: clamp(32px, 7vw, 68px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 24px 70px rgba(30, 41, 59, .08);
    }
    .illustration {
      position: relative;
      width: 190px;
      height: 150px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
    }
    .number {
      font-size: clamp(76px, 15vw, 112px);
      line-height: 1;
      font-weight: 850;
      letter-spacing: -9px;
      color: var(--primary);
    }
    .planet {
      position: absolute;
      width: 24px;
      height: 24px;
      top: 5px;
      right: 7px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 0 8px rgba(251, 191, 36, .13);
    }
    .orbit {
      position: absolute;
      width: 178px;
      height: 62px;
      border: 2px dashed #c7c9ff;
      border-radius: 50%;
      transform: rotate(-17deg);
    }
    h1 {
      margin: 8px 0 12px;
      font-size: clamp(26px, 5vw, 36px);
      letter-spacing: -1.2px;
    }
    p {
      max-width: 460px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    a {
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      text-decoration: none;
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    }
    a:hover { transform: translateY(-2px); }
    .primary {
      color: #fff;
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 8px 18px rgba(99, 91, 255, .22);
    }
    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #fff; }
    .secondary:hover { background: #f8fafc; }
    .footer {
      margin-top: 34px;
      color: #94a3b8;
      font-size: 12px;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .container { border-radius: 20px; }
      .actions { flex-direction: column; }
      .actions a { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="illustration" aria-hidden="true">
      <div class="orbit"></div>
      <div class="number">404</div>
      <div class="planet"></div>
    </div>

    <h1>Oops! Page not found</h1>
    <p>
      The page you're looking for may have been moved, deleted, or never existed.
      Let's get you back on track.
    </p>

    <div class="actions">
      <a class="primary" href="/" aria-label="Go to homepage">
        <span aria-hidden="true">⌂</span> Back to Home
      </a>
      <a class="secondary" href="javascript:history.back()">
        <span aria-hidden="true">←</span> Go Back
      </a>
    </div>

    <div class="footer">Error code: 404 · Page Not Found</div>
  </main>
</body>
</html>
